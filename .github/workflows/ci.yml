name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/57-initialize-web-app
      - feature/issue-91-auth-platform-admin
      - feature/issue-92-admin-account-provisioning

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_CI_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_CI_PUBLISHABLE_KEY }}
      HAS_AUTH_TEST_SECRETS: ${{ secrets.SUPABASE_CI_URL != '' && secrets.SUPABASE_CI_PUBLISHABLE_KEY != '' && secrets.AUTH_CI_USER_EMAIL != '' && secrets.AUTH_CI_USER_PASSWORD != '' }}
      HAS_AUTH_ADMIN_TEST_SECRETS: ${{ secrets.SUPABASE_CI_URL != '' && secrets.SUPABASE_CI_PUBLISHABLE_KEY != '' && secrets.AUTH_CI_ADMIN_EMAIL != '' && secrets.AUTH_CI_ADMIN_PASSWORD != '' && (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') }}
      HAS_DEPARTMENT_RPC_TEST_SECRETS: ${{ secrets.SUPABASE_CI_URL != '' && secrets.SUPABASE_CI_PUBLISHABLE_KEY != '' && secrets.AUTH_CI_USER_EMAIL != '' && secrets.AUTH_CI_USER_PASSWORD != '' && secrets.AUTH_CI_ADMIN_EMAIL != '' && secrets.AUTH_CI_ADMIN_PASSWORD != '' && (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') }}
      HAS_ISSUE_92_AUTH_FLOW_TEST_SECRETS: ${{ secrets.SUPABASE_CI_URL != '' && (secrets.SUPABASE_SECRET_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Reject shared or production Supabase targets
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        shell: bash
        run: |
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *dzsacdtolxrqgwlekzdg*|*uwrzrwwzkurjdhxituwq*)
              echo "Refusing to build authenticated CI tests against DEV or PROD."
              exit 1
              ;;
          esac
          echo "Supabase CI target is not the shared DEV or PROD project."

      - name: Verify issue 92 Auth identity reuse against isolated Supabase CI
        if: env.HAS_ISSUE_92_AUTH_FLOW_TEST_SECRETS == 'true'
        env:
          SUPABASE_CI_URL: ${{ secrets.SUPABASE_CI_URL }}
          SUPABASE_CI_ADMIN_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' && secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/issue-92-auth-identity-flow-smoke.cjs

      - name: Explain skipped issue 92 Auth identity integration test
        if: env.HAS_ISSUE_92_AUTH_FLOW_TEST_SECRETS != 'true'
        run: echo "Issue 92 Auth identity integration test skipped: dedicated isolated Supabase CI URL and admin key are required."

      - name: Test issue 92 employee input and organization lookup
        run: >-
          node --experimental-strip-types --test
          src/lib/admin/employee-input.test.ts
          src/lib/admin/email-duplicate-core.test.ts
          src/lib/admin/employee-registration-validation-core.test.ts
          src/lib/admin/employee-validation-handler.test.ts
          src/lib/admin/list-organizations-core.test.ts
          src/lib/admin/organizations-handler.test.ts
          src/lib/admin/employee-provisioning-core.test.ts
          src/lib/admin/employee-provisioning-email-crypto.test.ts
          src/lib/admin/employee-provisioning-orchestrator-core.test.ts
          src/lib/admin/employee-provisioning-request-core.test.ts
          src/lib/admin/employee-invite-link-core.test.ts
          src/lib/admin/employee-provisioning-invite-link-crypto-core.test.ts
          src/lib/admin/employee-provisioning-handler.test.ts
          src/lib/admin/employee-provisioning-reconciliation-handler.test.ts
          src/lib/admin/employee-provisioning-reconciliation-sql-contract.test.cjs

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js application with dedicated CI Supabase configuration
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npm run build

      - name: Explain skipped authenticated application build
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: echo "Authenticated application build skipped because the dedicated CI Supabase project is not configured."

      - name: Smoke test protected admin route without a session
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        shell: bash
        run: |
          setsid npm run start -- --hostname 127.0.0.1 > /tmp/connexa-next.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT

          status=""
          for attempt in {1..30}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin || true)
            if [ "$status" = "307" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "307" ]; then
            echo "Expected HTTP 307 for unauthenticated /admin; received: $status"
            cat /tmp/connexa-next.log
            exit 1
          fi

          location=$(curl -sS -D - -o /dev/null http://127.0.0.1:3000/admin | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\\r$/, ""); print $2 }')
          location_path="${location#http://localhost:3000}"
          if [[ "$location_path" != /login* ]]; then
            echo "Expected redirect to /login; received: $location"
            exit 1
          fi

          echo "PASS: unauthenticated /admin requests redirect to /login."

          first_access_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/primeiro-acesso || true)
          if [ "$first_access_status" != "307" ]; then
            echo "Expected unauthenticated /primeiro-acesso to redirect; received: $first_access_status"
            cat /tmp/connexa-next.log
            exit 1
          fi

          invite_status=$(curl -sS -D - -o /dev/null 'http://127.0.0.1:3000/auth/callback?type=invite' | awk 'NR==1 {print $2}')
          if [ "$invite_status" != "307" ]; then
            echo "Expected malformed invitation callback to redirect; received: $invite_status"
            cat /tmp/connexa-next.log
            exit 1
          fi

          invite_redirect=$(curl -sS -D - -o /dev/null 'http://127.0.0.1:3000/auth/callback?token_hash=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&type=invite' | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\\r$/, ""); print $2 }')
          if [[ "$invite_redirect" != *"/convite-invalido"* || "$invite_redirect" == *"token_hash="* ]]; then
            echo "Expected query-string invite tokens to be rejected without forwarding the token; received: $invite_redirect"
            cat /tmp/connexa-next.log
            exit 1
          fi

          csrf_status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://attacker.invalid' \
            -H 'Content-Type: application/json' \
            --data '{"password":"not-a-real-password"}' \
            http://127.0.0.1:3000/api/auth/first-access/password || true)
          if [ "$csrf_status" != "403" ]; then
            echo "Expected cross-origin password update to be rejected with HTTP 403; received: $csrf_status"
            cat /tmp/connexa-next.log
            exit 1
          fi

          echo "PASS: first-access route redirects without session, malformed invite is rejected, and cross-origin password update is blocked."

      - name: Build Next.js application without Supabase configuration
        shell: bash
        run: |
          rm -rf .next
          env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY npm run build

      - name: Smoke test admin route fails closed when Supabase configuration is missing
        shell: bash
        run: |
          env -u NEXT_PUBLIC_SUPABASE_URL -u NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY setsid npm run start -- --hostname 127.0.0.1 --port 3001 > /tmp/connexa-no-supabase-config.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT

          status=""
          for attempt in {1..30}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/admin || true)
            if [ "$status" = "307" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "307" ]; then
            echo "Expected HTTP 307 when Supabase configuration is missing; received: $status"
            cat /tmp/connexa-no-supabase-config.log
            exit 1
          fi

          location=$(curl -sS -D - -o /dev/null http://127.0.0.1:3001/admin | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\\r$/, ""); print $2 }')
          location_path="${location#http://localhost:3001}"
          if [[ "$location_path" != /acesso-negado* ]]; then
            echo "Expected redirect to /acesso-negado; received: $location"
            cat /tmp/connexa-no-supabase-config.log
            exit 1
          fi

          public_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/login || true)
          if [ "$public_status" != "200" ]; then
            echo "Expected public /login to remain available; received: $public_status"
            exit 1
          fi

          echo "PASS: /admin fails closed without Supabase configuration and /login remains public."


      - name: Test department RPC authorization through PostgREST with real JWTs
        if: env.HAS_DEPARTMENT_RPC_TEST_SECRETS == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_CI_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_CI_PUBLISHABLE_KEY }}
          AUTH_TEST_USER_EMAIL: ${{ secrets.AUTH_CI_USER_EMAIL }}
          AUTH_TEST_USER_PASSWORD: ${{ secrets.AUTH_CI_USER_PASSWORD }}
          AUTH_TEST_ADMIN_EMAIL: ${{ secrets.AUTH_CI_ADMIN_EMAIL }}
          AUTH_TEST_ADMIN_PASSWORD: ${{ secrets.AUTH_CI_ADMIN_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            *dzsacdtolxrqgwlekzdg*|*uwrzrwwzkurjdhxituwq*)
              echo "Refusing to run department RPC tests against DEV or PROD."
              exit 1
              ;;
          esac
          node scripts/department-rpc-security-smoke.cjs

      - name: Explain skipped department RPC PostgREST test
        if: env.HAS_DEPARTMENT_RPC_TEST_SECRETS != 'true'
        run: |
          echo "Department RPC PostgREST test skipped: dedicated online CI Supabase URL/key and synthetic CI user/admin credentials are required."

      - name: Install browser test dependencies
        if: env.HAS_AUTH_TEST_SECRETS == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test regular user login and admin denial
        if: env.HAS_AUTH_TEST_SECRETS == 'true'
        env:
          AUTH_TEST_USER_EMAIL: ${{ secrets.AUTH_CI_USER_EMAIL }}
          AUTH_TEST_USER_PASSWORD: ${{ secrets.AUTH_CI_USER_PASSWORD }}
        shell: bash
        run: |
          setsid npm run start -- --hostname 127.0.0.1 > /tmp/connexa-auth-test.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            sleep 2
          done

          node scripts/auth-regular-user-smoke.cjs

      - name: Test platform administrator login, access, and logout
        if: env.HAS_AUTH_ADMIN_TEST_SECRETS == 'true'
        env:
          AUTH_TEST_ADMIN_EMAIL: ${{ secrets.AUTH_CI_ADMIN_EMAIL }}
          AUTH_TEST_ADMIN_PASSWORD: ${{ secrets.AUTH_CI_ADMIN_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          setsid npm run start -- --hostname 127.0.0.1 > /tmp/connexa-admin-auth-test.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              break
            fi
            sleep 2
          done

          node scripts/auth-admin-smoke.cjs

      - name: Explain skipped administrator browser test
        if: env.HAS_AUTH_ADMIN_TEST_SECRETS != 'true'
        run: echo "Administrator browser test skipped because its GitHub Actions secrets are not configured."

      - name: Explain skipped authenticated browser test
        if: env.HAS_AUTH_TEST_SECRETS != 'true'
        run: echo "Authenticated browser test skipped because its GitHub Actions secrets are not configured."

  validate-issue-92-postgres-draft:
    name: Validate issue 92 SQL draft in disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated schema fixture and compile SQL draft
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --file scripts/issue-92-postgres-syntax-fixture.sql
          psql --host 127.0.0.1 --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --file docs/contracts/employee-provisioning-issue-92-migration-draft.sql
