name: CI

on:
  pull_request:
    branches: [main, feature/97-device-session-audit]
  push:
    branches:
      - main
      - feature/57-initialize-web-app
      - feature/issue-91-auth-platform-admin
      - feature/106-auth-session-hardening

permissions:
  contents: read

jobs:
  validate-app:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test isolated Supabase allowlist guard
        run: node scripts/assert-isolated-supabase-smoke.cjs

      - name: Test local authentication flow rules
        run: npm run test:auth

      - name: Report dependency advisories for review
        continue-on-error: true
        shell: bash
        run: |
          audit_status=0
          npm audit --json > /tmp/npm-audit.json || audit_status=$?
          AUDIT_STATUS="$audit_status" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          const advisories = Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            via: (item.via ?? []).map((entry) => typeof entry === "string" ? entry : {
              title: entry.title,
              url: entry.url,
              range: entry.range,
              severity: entry.severity,
            }),
          }));
          console.log(JSON.stringify({
            exitCode: Number(process.env.AUDIT_STATUS ?? 0),
            metadata: report.metadata?.vulnerabilities,
            advisories,
          }, null, 2));
          NODE

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Smoke test protected admin route without a session
        shell: bash
        run: |
          setsid npm run start -- --hostname 127.0.0.1 > /tmp/connexa-next.log 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true' EXIT

          status=""
          for attempt in {1..30}; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin || true)
            if [ "$status" = "307" ]; then
              break
            fi
            sleep 2
          done

          if [ "$status" != "307" ]; then
            echo "Expected HTTP 307 for unauthenticated /admin; received: $status"
            cat /tmp/connexa-next.log
            exit 1
          fi

          location=$(curl -sS -D - -o /dev/null http://127.0.0.1:3000/admin | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); print $2 }')
          location_path="/${location#*://*/}"
          if [[ "$location_path" != /acesso-negado* ]]; then
            echo "Expected fail-closed redirect to /acesso-negado without Supabase config; received: $location"
            exit 1
          fi

          public_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login || true)
          if [ "$public_status" != "200" ]; then
            echo "Expected public /login to remain available; received: $public_status"
            exit 1
          fi

          for protected_path in / /conversas /grupos /colaboradores /departamentos /arquivos /admin/dispositivos; do
            protected_status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${protected_path}" || true)
            protected_location=$(curl -sS -D - -o /dev/null "http://127.0.0.1:3000${protected_path}" | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); print $2 }')
            protected_location_path="/${protected_location#*://*/}"
            if [ "$protected_status" != "307" ] || [[ "$protected_location_path" != /acesso-negado* ]]; then
              echo "Expected ${protected_path} to fail closed at /acesso-negado; received HTTP ${protected_status}, location: ${protected_location}"
              exit 1
            fi
          done

          unavailable_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/servico-indisponivel || true)
          if [ "$unavailable_status" != "200" ]; then
            echo "Expected public service-unavailable page to remain available; received: $unavailable_status"
            exit 1
          fi

          enrollment_status=$(curl -sS -X POST -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/device-sessions/register || true)
          if [ "$enrollment_status" != "403" ]; then
            echo "Expected device enrollment to reject a request without a same-origin Origin header; received: $enrollment_status"
            exit 1
          fi

          echo "PASS: protected routes fail closed without Supabase configuration; recovery pages stay public and device enrollment rejects non-browser origins."
