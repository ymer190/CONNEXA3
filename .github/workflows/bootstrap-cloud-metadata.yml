name: Bootstrap cloud project metadata

on:
  push:
    branches:
      - infra/github-actions-supabase-cicd

permissions:
  contents: write

concurrency:
  group: bootstrap-cloud-metadata
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generate lockfile and Supabase CLI config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Generate npm lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.84.2

      - name: Initialize Supabase repository configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Commit generated metadata to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json supabase/config.toml
          if git diff --cached --quiet; then
            echo "No generated metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: add reproducible npm lockfile and Supabase config"
          git push origin "HEAD:infra/github-actions-supabase-cicd"
